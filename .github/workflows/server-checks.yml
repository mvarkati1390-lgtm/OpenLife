name: OpenLife server checks
on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8'))"
      - name: Check server JavaScript syntax
        run: node --check server/index.js
