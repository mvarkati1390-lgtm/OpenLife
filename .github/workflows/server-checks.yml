name: OpenLife server checks
on:
  push:
    paths:
      - "server/**"
      - "admin-panel/**"
      - ".github/workflows/server-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - "admin-panel/**"
      - ".github/workflows/server-checks.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Check server JavaScript syntax
        run: node --check server/index.js
      - name: Run server API smoke tests
        run: npm test --prefix server
      - name: Check admin panel JavaScript syntax
        run: node -e "const fs=require('fs');const vm=require('vm');const h=fs.readFileSync('admin-panel/index.html','utf8');const a=h.indexOf('<script>')+8;const b=h.indexOf('</script>',a);if(a<8||b<0)throw new Error('script not found');new vm.Script(h.slice(a,b));"
