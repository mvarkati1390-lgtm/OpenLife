name: OpenLife server checks
on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Check server JavaScript syntax
        run: node --check server/index.js
      - name: Run server API smoke tests
        run: npm test --prefix server
      - name: Check admin panel JavaScript syntax
        run: node -e "const fs=require('fs');const vm=require('vm');const html=fs.readFileSync('admin-panel/index.html','utf8');const script=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!script)throw new Error('script not found');new vm.Script(script[1]);"
