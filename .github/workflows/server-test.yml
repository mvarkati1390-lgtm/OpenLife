name: Server API tests

on:
  push:
    branches: [godot-migration]
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  pull_request:
    branches: [godot-migration]
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Run API tests
        working-directory: server
        run: npm test
