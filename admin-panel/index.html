<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت OpenLife</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font-family:Tahoma,Arial,sans-serif}header{padding:18px 5%;background:#182438;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:#1b2940;border:1px solid #30415d;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #52627a;margin:4px}input{background:#101827;color:white}button{background:#2676d2;color:white;cursor:pointer;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:26px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #34445c}small{color:#aebbd0}.hidden{display:none}.danger{background:#a93b49}
</style></head><body><header><strong>OpenLife | پنل مدیریت</strong><span id="status">آفلاین</span></header><main>
<section class="card" id="login"><h2>ورود مدیر</h2><input id="api" placeholder="نشانی سرور" value="http://localhost:3000"><br><input id="username" placeholder="نام کاربری"><input id="password" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p id="error"></p></section>
<section id="dashboard" class="hidden"><div class="grid"><div class="card">کل بازیکنان<div class="metric" id="total">-</div></div><div class="card">آنلاین<div class="metric" id="online">-</div></div><div class="card">مسدود<div class="metric" id="banned">-</div></div><div class="card">گزارش باز<div class="metric" id="reports">-</div></div></div>
<div class="card"><h3>جست‌وجوی بازیکن</h3><input id="search" placeholder="نام کاربری"><button onclick="loadPlayers()">جست‌وجو</button><div style="overflow:auto"><table><thead><tr><th>شناسه</th><th>نام</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="players"></tbody></table></div></div>
<div class="card" id="roleCard"><h3>تغییر نقش بازیکن (فقط مالک)</h3><input id="roleId" type="number" placeholder="شناسه بازیکن"><select id="roleValue"><option value="player">بازیکن</option><option value="moderator">ناظر</option><option value="admin">ادمین</option><option value="manager">مدیر</option></select><button onclick="setRole()">ثبت نقش</button><small>سرور فقط به مالک اجازه تغییر نقش می‌دهد.</small></div><div class="card"><h3>گزارش‌ها</h3><button onclick="loadReports()">بارگذاری گزارش‌ها</button><div id="reportList"></div></div><div class="card" id="auditCard"><h3>گزارش فعالیت مدیران</h3><button onclick="loadAudit()">بارگذاری رویدادها</button><div id="auditList"></div></div>
<button class="danger" onclick="logout()">خروج</button></section></main>
<script>
const $ = id => document.getElementById(id);
let token = "", base = "", refreshTimer = null, currentRole = "";

async function call(path, options = {}) {
  const response = await fetch(base + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": "Bearer " + token } : {}),
      ...(options.headers || {})
    }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "خطا در ارتباط با سرور");
  return data;
}

async function login() {
  base = $("api").value.trim().replace(/\/$/, "");
  if (!/^https?:\/\//i.test(base)) { $("error").textContent = "آدرس سرور معتبر نیست"; return; }
  try {
    const response = await fetch(base + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: $("password").value })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "ورود ناموفق بود");
    token = data.token;
    currentRole = data.user ? data.user.role : "";
    $("roleCard").classList.toggle("hidden", currentRole !== "owner");
    $("auditCard").classList.toggle("hidden", !["owner", "manager"].includes(currentRole));
    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("status").textContent = "متصل";
    await refresh();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => refresh().catch(showError), 15000);
  } catch (error) {
    $("error").textContent = error.message;
  }
}

async function refresh() {
  const data = await call("/api/admin/overview");
  $("total").textContent = data.total;
  $("online").textContent = data.online;
  $("banned").textContent = data.banned;
  $("reports").textContent = data.openReports;
  await loadPlayers();
}

async function loadPlayers() {
  const data = await call("/api/admin/players?q=" + encodeURIComponent($("search").value));
  $("players").innerHTML = data.players.map(player =>
    '<tr><td>' + player.id + '</td><td>' + safe(player.username) +
    '</td><td>' + safe(player.role) + '</td><td>' +
    (player.online ? 'آنلاین' : 'آفلاین') + (player.banned ? ' / مسدود' : '') +
    '</td><td>' +
    (player.banned
      ? '<button onclick="action(' + player.id + ',\'unban\')">رفع مسدودی</button>'
      : '<button class="danger" onclick="action(' + player.id + ',\'ban\')">مسدودسازی</button>') +
    ' <button onclick="action(' + player.id + ',\'warn\')">اخطار</button></td></tr>'
  ).join("");
}

async function action(id, kind) {
  if (!confirm("این عملیات انجام شود؟")) return;
  try {
    await call("/api/admin/player/" + id + "/" + kind, {
      method: "POST", body: JSON.stringify({ reason: "اقدام از پنل" })
    });
    await refresh();
  } catch (error) { showError(error); }
}

async function setRole() {
  try {
    await call("/api/owner/role", {
      method: "POST",
      body: JSON.stringify({ userId: Number($("roleId").value), role: $("roleValue").value })
    });
    alert("نقش به‌روزرسانی شد");
    await refresh();
  } catch (error) { showError(error); }
}

async function loadAudit() {
  try {
    const data = await call("/api/admin/audit");
    $("auditList").innerHTML = data.events.map(event =>
      '<p class="card">#' + event.id + ' | ' + safe(event.actor || "سیستم") + ' | ' + safe(event.action) + ' | هدف: ' + safe(event.target_id) +
      '<br>' + safe(event.detail || "") + '<br><small>' + safe(event.created_at) + '</small></p>'
    ).join("") || "رویدادی ثبت نشده است";
  } catch (error) { showError(error); }
}

async function loadReports() {
  try {
    const data = await call("/api/admin/reports");
    $("reportList").innerHTML = data.reports.map(report =>
      '<p class="card">گزارش #' + report.id + ' | ' + safe(report.reporter) +
      ' درباره ' + safe(report.target_username) + '<br>' + safe(report.reason) +
      '<br>وضعیت: ' + safe(report.status) +
      (report.status === "open" ? ' <button onclick="resolveReport(' + report.id + ')">بستن گزارش</button>' : '') + '</p>'
    ).join("") || "گزارشی نیست";
  } catch (error) { showError(error); }
}

async function resolveReport(id) {
  if (!confirm("این گزارش بسته شود؟")) return;
  try {
    await call("/api/admin/report/" + id + "/resolve", { method: "POST", body: "{}" });
    await loadReports();
    await refresh();
  } catch (error) { showError(error); }
}

function safe(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

function showError(error) {
  $("status").textContent = "خطا";
  $("error").textContent = error.message || String(error);
}

function logout() {
  token = "";
  currentRole = "";
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
  $("dashboard").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("status").textContent = "آفلاین";
  $("password").value = "";
}
</script></body></html>
