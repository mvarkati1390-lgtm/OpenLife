<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت OpenLife</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font-family:Tahoma,Arial,sans-serif}header{padding:18px 5%;background:#182438;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:#1b2940;border:1px solid #30415d;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #52627a;margin:4px}input{background:#101827;color:white}button{background:#2676d2;color:white;cursor:pointer;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:26px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #34445c}small{color:#aebbd0}.hidden{display:none}.danger{background:#a93b49}
</style></head><body><header><strong>OpenLife | پنل مدیریت</strong><span id="status">آفلاین</span></header><main>
<section class="card" id="login"><h2>ورود مدیر</h2><input id="api" placeholder="نشانی سرور" value="http://localhost:3000"><br><input id="username" placeholder="نام کاربری"><input id="password" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p id="error"></p></section>
<section id="dashboard" class="hidden"><div class="grid"><div class="card">کل بازیکنان<div class="metric" id="total">-</div></div><div class="card">آنلاین<div class="metric" id="online">-</div></div><div class="card">مسدود<div class="metric" id="banned">-</div></div><div class="card">گزارش باز<div class="metric" id="reports">-</div></div></div>
<div class="card"><h3>جست‌وجوی بازیکن</h3><input id="search" placeholder="نام کاربری"><button onclick="loadPlayers()">جست‌وجو</button><div style="overflow:auto"><table><thead><tr><th>شناسه</th><th>نام</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="players"></tbody></table></div></div>
<div class="card"><h3>تغییر نقش بازیکن (فقط مالک)</h3><input id="roleId" type="number" placeholder="شناسه بازیکن"><select id="roleValue"><option value="player">بازیکن</option><option value="moderator">ناظر</option><option value="admin">ادمین</option><option value="manager">مدیر</option></select><button onclick="setRole()">ثبت نقش</button><small>سرور فقط به مالک اجازه تغییر نقش می‌دهد.</small></div><div class="card"><h3>گزارش‌ها</h3><button onclick="loadReports()">بارگذاری گزارش‌ها</button><div id="reportList"></div></div>
<button class="danger" onclick="logout()">خروج</button></section></main>
<script>
let token="",base="";
async function call(path,options={}){const r=await fetch(base+path,{...options,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...options.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}
async function login(){base=document.getElementById("api").value.replace(/\/$/,"");try{const r=await fetch(base+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;loginBox();await refresh()}catch(e){error.textContent=e.message}}
function loginBox(){document.getElementById("login").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");status.textContent="متصل"}
async function refresh(){const d=await call("/api/admin/overview");total.textContent=d.total;online.textContent=d.online;banned.textContent=d.banned;reports.textContent=d.openReports;await loadPlayers()}
async function loadPlayers(){const d=await call("/api/admin/players?q="+encodeURIComponent(search.value));players.innerHTML=d.players.map(p=>'<tr><td>'+p.id+'</td><td>'+safe(p.username)+'</td><td>'+p.role+'</td><td>'+(p.online?'آنلاین':'آفلاین')+(p.banned?' / مسدود':'')+'</td><td>'+(p.banned?'<button onclick="action('+p.id+',\'unban\')">رفع مسدودی</button>':'<button class="danger" onclick="action('+p.id+',\'ban\')">مسدودسازی</button>')+' <button onclick="action('+p.id+',\'warn\')">اخطار</button></td></tr>').join("")}
async function action(id,kind){if(!confirm("این عملیات انجام شود؟"))return;try{await call("/api/admin/player/"+id+"/"+kind,{method:"POST",body:JSON.stringify({reason:"اقدام از پنل"})});await refresh()}catch(e){alert(e.message)}}
async function setRole(){try{await call("/api/owner/role",{method:"POST",body:JSON.stringify({userId:Number(roleId.value),role:roleValue.value})});alert("نقش به‌روزرسانی شد");await refresh()}catch(e){alert(e.message)}}
async function loadReports(){const d=await call("/api/admin/reports");reportList.innerHTML=d.reports.map(x=>'<p class="card">گزارش #'+x.id+' | '+safe(x.reporter)+' درباره '+safe(x.target_username)+'<br>'+safe(x.reason)+'</p>').join("")||"گزارشی نیست"}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function logout(){token="";dashboard.classList.add("hidden");login.classList.remove("hidden");status.textContent="آفلاین"}
</script></body></html>
