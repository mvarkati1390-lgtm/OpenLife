services:
  - type: web
    name: openlife-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: DB_FILE
        value: /tmp/openlife.db
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://mvarkati1390-lgtm.github.io"
