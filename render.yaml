services:
  - type: web
    name: openlife-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    plan: starter
    disk:
      name: openlife-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_FILE
        value: /var/data/openlife.db
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://mvarkati1390-lgtm.github.io"
